<!DOCTYPE html>
<html>
<body>
<canvas id="c"></canvas>
<script>
  const img = new Image();
  img.src = 'file:///C:/Users/thoms/Downloads/adley%20fernandes%20portfolio/adley-fernandes-portfolio-master/Images/LUKES%20ICED%20COFFEE.webp';
  img.onload = () => {
    const c = document.getElementById('c');
    const ctx = c.getContext('2d', {willReadFrequently: true});
    c.width = img.width / 10; 
    c.height = img.height / 10;
    ctx.drawImage(img, 0, 0, c.width, c.height);
    const data = ctx.getImageData(0,0,c.width,c.height).data;
    const counts = {};
    for(let i=0; i<data.length; i+=4) {
      let r = data[i], g = data[i+1], b = data[i+2];
      if (r>240 && g>240 && b>240) continue;
      if (r<20 && g<20 && b<20) continue;
      let hex = '#' + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1).toUpperCase();
      counts[hex] = (counts[hex]||0)+1;
    }
    const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    document.body.innerHTML += "<div id='result'>" + sorted.slice(0,50).map(x=>x[0]+':'+x[1]).join(', ') + "</div>";
  };
</script>
</body>
</html>
